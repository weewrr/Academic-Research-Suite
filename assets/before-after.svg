<svg xmlns="http://www.w3.org/2000/svg" width="920" height="410" viewBox="0 0 920 410" font-family="-apple-system,'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="920" height="410" fill="#ffffff"/>
  <text x="460" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Before &#8594; After</text>
  <text x="460" y="54" text-anchor="middle" font-size="12" fill="#94a3b8">why consolidation matters</text>

  <!-- LEFT: 180+ separate skills -->
  <rect x="36" y="76" width="392" height="300" rx="14" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="232" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">180+ separate skills</text>
  <text x="232" y="121" text-anchor="middle" font-size="11" fill="#f87171">installed &amp; maintained one by one</text>

  <g font-family="Consolas,'Cascadia Code',monospace" font-size="9.5">
    <!-- row 1 -->
    <rect x="56"  y="132" width="86" height="24" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="62" y="147" fill="#6b7280">paper-writing</text>
    <rect x="150" y="132" width="86" height="24" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="156" y="147" fill="#6b7280">docx</text>
    <rect x="244" y="132" width="86" height="24" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="250" y="147" fill="#6b7280">paper-scout</text>
    <rect x="338" y="132" width="86" height="24" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="344" y="147" fill="#6b7280">chembl</text>
    <!-- row 2 -->
    <rect x="56"  y="164" width="86" height="24" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="62" y="179" fill="#b91c1c">paper-writing</text>
    <text x="132" y="179" fill="#ef4444" font-weight="700">&#215;2</text>
    <rect x="150" y="164" width="86" height="24" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="156" y="179" fill="#6b7280">peer-review</text>
    <rect x="244" y="164" width="86" height="24" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="250" y="179" fill="#6b7280">pdf</text>
    <rect x="338" y="164" width="86" height="24" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="344" y="179" fill="#6b7280">pubmed</text>
    <!-- row 3 -->
    <rect x="56"  y="196" width="86" height="24" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="62" y="211" fill="#6b7280">lit-review</text>
    <rect x="150" y="196" width="86" height="24" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="156" y="211" fill="#b91c1c">paper-writing</text>
    <text x="226" y="211" fill="#ef4444" font-weight="700">&#215;3</text>
    <rect x="244" y="196" width="86" height="24" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="250" y="211" fill="#6b7280">pptx</text>
    <rect x="338" y="196" width="86" height="24" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="344" y="211" fill="#6b7280">zotero</text>
    <!-- row 4 -->
    <rect x="56"  y="228" width="86" height="24" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="62" y="243" fill="#b91c1c">lit-review</text>
    <text x="118" y="243" fill="#ef4444" font-weight="700">&#215;2</text>
    <rect x="150" y="228" width="86" height="24" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="156" y="243" fill="#6b7280">xlsx</text>
    <rect x="244" y="228" width="86" height="24" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="250" y="243" fill="#6b7280">idea-gen</text>
    <rect x="338" y="228" width="86" height="24" rx="6" fill="none" stroke="#d1d5db" stroke-dasharray="4 3"/>
    <text x="366" y="243" fill="#9ca3af" text-anchor="middle">&#8230; &#215;160</text>
  </g>

  <!-- left pain badges -->
  <g filter="url(#shadow)">
    <rect x="56"  y="270" width="112" height="28" rx="14" fill="#ffffff" stroke="#fecaca"/>
    <rect x="176" y="270" width="112" height="28" rx="14" fill="#ffffff" stroke="#fecaca"/>
    <rect x="296" y="270" width="112" height="28" rx="14" fill="#ffffff" stroke="#fecaca"/>
  </g>
  <g fill="#ef4444"><circle cx="72" cy="284" r="3.5"/><circle cx="192" cy="284" r="3.5"/><circle cx="312" cy="284" r="3.5"/></g>
  <g font-size="11" fill="#b91c1c">
    <text x="82" y="288">context bloat</text>
    <text x="202" y="288">trigger clashes</text>
    <text x="322" y="288">N installs</text>
  </g>
  <text x="232" y="342" text-anchor="middle" font-size="11.5" fill="#94a3b8">every skill description competes for the context window</text>

  <!-- VS -->
  <circle cx="460" cy="226" r="30" fill="#1e293b" filter="url(#shadow)"/>
  <text x="460" y="232" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">VS</text>

  <!-- RIGHT: one suite -->
  <rect x="492" y="76" width="392" height="300" rx="14" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
  <text x="688" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#047857">1 &#183; Academic Research Suite</text>
  <text x="688" y="121" text-anchor="middle" font-size="11" fill="#10b981">install once, everything routes</text>

  <!-- router card -->
  <rect x="512" y="132" width="352" height="40" rx="8" fill="#1e293b" filter="url(#shadow)"/>
  <text x="688" y="157" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">SKILL.md &#8212; intent router</text>

  <line x1="688" y1="172" x2="688" y2="188" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4 domain chips -->
  <g filter="url(#shadow)">
    <rect x="512" y="194" width="82" height="34" rx="8" fill="#3b82f6"/>
    <rect x="602" y="194" width="82" height="34" rx="8" fill="#10b981"/>
    <rect x="692" y="194" width="82" height="34" rx="8" fill="#f59e0b"/>
    <rect x="782" y="194" width="82" height="34" rx="8" fill="#8b5cf6"/>
  </g>
  <g font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="553" y="215">Discovery</text>
    <text x="643" y="215">Writing</text>
    <text x="733" y="215">Review</text>
    <text x="823" y="215">Pipeline</text>
  </g>

  <!-- resources pill -->
  <rect x="512" y="240" width="352" height="30" rx="15" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="688" y="259" text-anchor="middle" font-size="10.5" fill="#64748b">scripts &#183; tools &#183; commands &#183; templates &#8212; loaded on demand</text>

  <!-- right win badges -->
  <g filter="url(#shadow)">
    <rect x="512" y="286" width="112" height="28" rx="14" fill="#ffffff" stroke="#a7f3d0"/>
    <rect x="632" y="286" width="112" height="28" rx="14" fill="#ffffff" stroke="#a7f3d0"/>
    <rect x="752" y="286" width="112" height="28" rx="14" fill="#ffffff" stroke="#a7f3d0"/>
  </g>
  <g fill="#10b981"><circle cx="528" cy="300" r="3.5"/><circle cx="648" cy="300" r="3.5"/><circle cx="768" cy="300" r="3.5"/></g>
  <g font-size="11" fill="#047857">
    <text x="538" y="304">one install</text>
    <text x="658" y="304">on-demand load</text>
    <text x="778" y="304">zero clashes</text>
  </g>
  <text x="688" y="342" text-anchor="middle" font-size="11.5" fill="#94a3b8">one ~70-line router stays resident; guides load only when matched</text>
</svg>
