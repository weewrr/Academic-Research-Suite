  <circle cx="273" cy="298" r="16" fill="#10b981"/><use href="#i-chart" x="273" y="298"/>
  <text x="299" y="294" font-size="13.5" font-weight="700" fill="#1e293b">Figures &amp; Posters</text>
  <text x="299" y="312" font-size="10.5" fill="#94a3b8">colorblind-safe &#183; LaTeX</text>

  <g filter="url(#shadow)"><rect x="241" y="340" width="205" height="64" rx="10" fill="#ffffff" stroke="#e2e8f0"/></g>
  <circle cx="273" cy="372" r="16" fill="#10b981"/><use href="#i-doc" x="273" y="372"/>
  <text x="299" y="368" font-size="13.5" font-weight="700" fill="#1e293b">Office Documents</text>
  <text x="299" y="386" font-size="10.5" fill="#94a3b8">docx &#183; pdf &#183; pptx &#183; xlsx</text>

