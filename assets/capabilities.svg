    <g id="i-grid"><rect x="-7" y="-7" width="6" height="6" rx="1.5" fill="#fff"/><rect x="1" y="-7" width="6" height="6" rx="1.5" fill="#fff" opacity="0.7"/><rect x="-7" y="1" width="6" height="6" rx="1.5" fill="#fff" opacity="0.7"/><rect x="1" y="1" width="6" height="6" rx="1.5" fill="#fff" opacity="0.45"/></g>
