  <text x="520" y="164" font-size="10.5" fill="#94a3b8">5-seat reviewer panel</text>

  <g filter="url(#shadow)"><rect x="462" y="192" width="205" height="64" rx="10" fill="#ffffff" stroke="#e2e8f0"/></g>
  <circle cx="494" cy="224" r="16" fill="#f59e0b"/><use href="#i-check" x="494" y="224"/>
