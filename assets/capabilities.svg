  <g filter="url(#shadow)"><rect x="462" y="118" width="205" height="64" rx="10" fill="#ffffff" stroke="#e2e8f0"/></g>
  <circle cx="494" cy="150" r="16" fill="#f59e0b"/><use href="#i-shield" x="494" y="150"/>
