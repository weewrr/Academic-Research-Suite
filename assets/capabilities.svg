  <rect width="920" height="500" fill="#ffffff"/>
  <text x="460" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">One skill, 17 capabilities</text>
  <text x="460" y="54" text-anchor="middle" font-size="12" fill="#94a3b8">say what you need &#8212; the router picks the guide</text>

  <!-- Column headers -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="20"  y="74" width="205" height="30" rx="15" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="122" y="94" fill="#1d4ed8">Discovery &amp; Reading</text>
    <rect x="241" y="74" width="205" height="30" rx="15" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/><text x="343" y="94" fill="#047857">Writing &amp; Output</text>
    <rect x="462" y="74" width="205" height="30" rx="15" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="564" y="94" fill="#b45309">Review &amp; Quality</text>
    <rect x="683" y="74" width="205" height="30" rx="15" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/><text x="785" y="94" fill="#6d28d9">Pipeline &amp; Domain</text>
  </g>

  <!-- Card generator: rect + icon circle + use + title + sub -->
  <!-- Col 1 (blue) -->
  <g filter="url(#shadow)"><rect x="20" y="118" width="205" height="64" rx="10" fill="#ffffff" stroke="#e2e8f0"/></g>
  <circle cx="52" cy="150" r="16" fill="#3b82f6"/><use href="#i-search" x="52" y="150"/>
  <text x="78" y="146" font-size="13.5" font-weight="700" fill="#1e293b">Find Papers</text>
  <text x="78" y="164" font-size="10.5" fill="#94a3b8">arXiv &#183; PubMed &#183; Scholar</text>

  <g filter="url(#shadow)"><rect x="20" y="192" width="205" height="64" rx="10" fill="#ffffff" stroke="#e2e8f0"/></g>
  <circle cx="52" cy="224" r="16" fill="#3b82f6"/><use href="#i-book" x="52" y="224"/>
  <text x="78" y="220" font-size="13.5" font-weight="700" fill="#1e293b">Deep Reading</text>
  <text x="78" y="238" font-size="10.5" fill="#94a3b8">DNL notes &#183; scoring</text>

  <g filter="url(#shadow)"><rect x="20" y="266" width="205" height="64" rx="10" fill="#ffffff" stroke="#e2e8f0"/></g>
  <circle cx="52" cy="298" r="16" fill="#3b82f6"/><use href="#i-doc" x="52" y="298"/>
