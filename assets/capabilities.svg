  <text x="299" y="164" font-size="10.5" fill="#94a3b8">9-step workflow</text>

  <g filter="url(#shadow)"><rect x="241" y="192" width="205" height="64" rx="10" fill="#ffffff" stroke="#e2e8f0"/></g>
  <circle cx="273" cy="224" r="16" fill="#10b981"/><use href="#i-layers" x="273" y="224"/>
