<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" font-family="-apple-system,'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
    <g id="i-search"><circle cx="-1" cy="-1" r="5.5" fill="none" stroke="#fff" stroke-width="2"/><line x1="3.2" y1="3.2" x2="8" y2="8" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></g>
    <g id="i-book"><path d="M-8,-5 C-5,-6.5 -2.5,-6.5 0,-5 C2.5,-6.5 5,-6.5 8,-5 L8,5 C5,3.5 2.5,3.5 0,5 C-2.5,3.5 -5,3.5 -8,5 Z" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/><line x1="0" y1="-4.5" x2="0" y2="4.5" stroke="#fff" stroke-width="1.8"/></g>
    <g id="i-doc"><path d="M-5,-7.5 L1.5,-7.5 L6,-3 L6,7.5 L-5,7.5 Z" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/><path d="M1.5,-7.5 L1.5,-3 L6,-3" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></g>
    <g id="i-list"><line x1="-7" y1="-5" x2="7" y2="-5" stroke="#fff" stroke-width="2" stroke-linecap="round"/><line x1="-7" y1="0" x2="7" y2="0" stroke="#fff" stroke-width="2" stroke-linecap="round"/><line x1="-7" y1="5" x2="7" y2="5" stroke="#fff" stroke-width="2" stroke-linecap="round"/></g>
    <g id="i-bulb"><circle cx="0" cy="-2" r="5" fill="none" stroke="#fff" stroke-width="1.8"/><line x1="-2.2" y1="4.5" x2="2.2" y2="4.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><line x1="-1.5" y1="7" x2="1.5" y2="7" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></g>
    <g id="i-pen"><line x1="-6" y1="7" x2="4" y2="-3" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><path d="M4,-3 L7.5,-6.5 L7.5,-2 Z" fill="#fff"/><line x1="-7.5" y1="8.5" x2="-4.5" y2="8.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></g>
    <g id="i-layers"><rect x="-7" y="-7" width="14" height="4.5" rx="1.5" fill="#fff"/><rect x="-7" y="-2.2" width="14" height="4.5" rx="1.5" fill="#fff" opacity="0.7"/><rect x="1.6" y="2.6" width="14" height="4.5" rx="1.5" fill="#fff" opacity="0.45"/></g>
    <g id="i-chart"><rect x="-7" y="-1" width="4" height="8" rx="1" fill="#fff"/><rect x="-2" y="-5" width="4" height="12" rx="1" fill="#fff" opacity="0.75"/><rect x="3" y="-8" width="4" height="15" rx="1" fill="#fff" opacity="0.5"/></g>
    <g id="i-shield"><path d="M0,-8 L6.5,-5.5 L6.5,0.5 C6.5,4.5 3.5,7.3 0,8.8 C-3.5,7.3 -6.5,4.5 -6.5,0.5 L-6.5,-5.5 Z" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/><path d="M-3,0 L-1,2.2 L3.2,-2.5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="i-check"><circle cx="0" cy="0" r="7.5" fill="none" stroke="#fff" stroke-width="1.8"/><path d="M-3.5,0 L-1,2.8 L4,-3" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="i-bubble"><rect x="-7.5" y="-6.5" width="15" height="11" rx="3" fill="none" stroke="#fff" stroke-width="1.8"/><path d="M-2,4.5 L-2,8.5 L2,4.5 Z" fill="#fff"/></g>
    <g id="i-hash"><line x1="-4" y1="-7" x2="-6" y2="7" stroke="#fff" stroke-width="2" stroke-linecap="round"/><line x1="3" y1="-7" x2="1" y2="7" stroke="#fff" stroke-width="2" stroke-linecap="round"/><line x1="-7.5" y1="-2.5" x2="7" y2="-2.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/><line x1="-7" y1="2.5" x2="7.5" y2="2.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/></g>
    <g id="i-flask"><path d="M-2.5,-8 L2.5,-8 L2.5,-2.5 L6.5,5.5 C7.5,7.5 6.5,8.5 4.5,8.5 L-4.5,8.5 C-6.5,8.5 -7.5,7.5 -6.5,5.5 L-2.5,-2.5 Z" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/><line x1="-4.5" y1="3.5" x2="4.5" y2="3.5" stroke="#fff" stroke-width="1.8"/></g>
    <g id="i-plane"><path d="M-8,-1.5 L9,-7 L2,1.5 L3,7 L-0.5,4.5 L-2.5,8.5 L-3,2.5 Z" fill="#fff"/></g>
