  <text x="78" y="312" font-size="10.5" fill="#94a3b8">PRISMA &#183; gap analysis</text>

  <g filter="url(#shadow)"><rect x="20" y="340" width="205" height="64" rx="10" fill="#ffffff" stroke="#e2e8f0"/></g>
  <circle cx="52" cy="372" r="16" fill="#3b82f6"/><use href="#i-list" x="52" y="372"/>
  <text x="78" y="368" font-size="13.5" font-weight="700" fill="#1e293b">Reading List</text>
  <text x="78" y="386" font-size="10.5" fill="#94a3b8">kanban &#183; HTML profile</text>

  <g filter="url(#shadow)"><rect x="20" y="414" width="205" height="64" rx="10" fill="#ffffff" stroke="#e2e8f0"/></g>
