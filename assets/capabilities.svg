  <g filter="url(#shadow)"><rect x="683" y="192" width="205" height="64" rx="10" fill="#ffffff" stroke="#e2e8f0"/></g>
  <circle cx="715" cy="224" r="16" fill="#8b5cf6"/><use href="#i-plane" x="715" y="224"/>
  <text x="741" y="220" font-size="13.5" font-weight="700" fill="#1e293b">Publishing</text>
  <text x="741" y="238" font-size="10.5" fill="#94a3b8">venue &#183; LaTeX &#183; package</text>

  <g filter="url(#shadow)"><rect x="683" y="266" width="205" height="64" rx="10" fill="#ffffff" stroke="#e2e8f0"/></g>
  <circle cx="715" cy="298" r="16" fill="#8b5cf6"/><use href="#i-award" x="715" y="298"/>
  <text x="741" y="294" font-size="13.5" font-weight="700" fill="#1e293b">Grants &amp; Clinical</text>
  <text x="741" y="312" font-size="10.5" fill="#94a3b8">NSF &#183; reports &#183; CDS</text>

  <g filter="url(#shadow)"><rect x="683" y="340" width="205" height="64" rx="10" fill="#ffffff" stroke="#e2e8f0"/></g>
  <circle cx="715" cy="372" r="16" fill="#8b5cf6"/><use href="#i-grid" x="715" y="372"/>
  <text x="741" y="368" font-size="13.5" font-weight="700" fill="#1e293b">148 Tool Guides</text>
