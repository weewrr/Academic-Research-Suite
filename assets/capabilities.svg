  <g filter="url(#shadow)"><rect x="462" y="340" width="205" height="64" rx="10" fill="#ffffff" stroke="#e2e8f0"/></g>
  <circle cx="494" cy="372" r="16" fill="#f59e0b"/><use href="#i-hash" x="494" y="372"/>
  <text x="520" y="368" font-size="13.5" font-weight="700" fill="#1e293b">Citations</text>
